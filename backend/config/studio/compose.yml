name: xuya-codex-studio
services:
  studio:
    image: xuya-island/agentscope-studio:1.0.9
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - "${XUYA_STUDIO_DATA_DIR:-../../data/studio}:/app/data"
    environment:
      LOG_LEVEL: warn
    restart: "no"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
